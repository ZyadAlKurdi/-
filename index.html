<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الخط العربي والكردي - 50 صفحة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

        /* إجبار المتصفح على طباعة الألوان والخطوط الباهتة بدقة */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-panel {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            width: 90%;
            max-width: 800px;
        }

        .header-panel h1 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .btn-download {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.4);
            margin-top: 10px;
        }

        .btn-download:hover { background-color: #2ecc71; }

        .instructions {
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }

        /* الحاوية التي ستجمع الـ 50 صفحة */
        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* إعدادات ورقة A4 الدقيقة */
        .a4-paper {
            width: 210mm;
            height: 297mm;
            background-color: white;
            box-sizing: border-box;
            padding: 22.5mm 15mm; /* هوامش لضبط 14 سطراً */
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            page-break-after: always; /* سر المهنة: فصل الصفحات عند الطباعة */
            overflow: hidden;
            flex-shrink: 0;
        }

        /* سطر الكتابة الموحد */
        .line-row {
            height: 1.8cm;
            line-height: 1.7cm;
            border-bottom: 2px solid #a4b0be;
            font-family: 'Aref Ruqaa', serif;
            font-size: 38px;
            white-space: nowrap;
            padding-right: 15px;
            box-sizing: border-box;
        }

        /* ضبط اللغة الكردية */
        [lang="ku"] .line-row {
            font-size: 36px;
            padding-right: 25px;
        }

        .master { color: #000; font-weight: bold; }
        .trace { color: #d1d8e0; }
        .empty { color: transparent; }

        /* إعدادات الطباعة الأصلية (Native Print) */
        @page {
            size: A4 portrait;
            margin: 0; /* إزالة هوامش المتصفح الافتراضية المزعجة */
        }

        @media print {
            body { 
                background: white; 
                padding: 0; 
                margin: 0;
            }
            .header-panel { display: none !important; } /* إخفاء الأزرار عند الطباعة */
            #pdf-container { 
                gap: 0; 
                display: block; 
            }
            .a4-paper { 
                box-shadow: none; 
                margin: 0; 
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h1>كراسة الـ 50 صفحة (عربي + كردي)</h1>
        <p>30 صفحة عربي، 10 صفحات شعر مزدوج، 10 صفحات كردي</p>
        <button class="btn-download" onclick="window.print()">📥 حفظ الكراسة بتنسيق PDF</button>
        <div class="instructions">⚠️ ملاحظة: عند ظهور نافذة الطباعة، اختر "حفظ بتنسيق PDF" (Save as PDF).</div>
    </div>

    <div id="pdf-container">
        <!-- سيتم توليد الـ 50 صفحة هنا برمجياً -->
    </div>

    <script>
        // 1. بيانات الدروس العربية (60 درساً = 30 صفحة)
        const arabicSingle = [
            "ا ل ك ط ظ", "ب ت ث ف", "ج ح خ", "د ذ ر ز", "س ش", "ص ض", "ع غ", "م ن هـ و ي", "ق ف", "لا ـلا",
            "أب أخ أم", "جد عم خال", "باب بيت نور", "قمر شمس نجم", "سيف رمح قوس", "علم عمل أمل", "صدق صبر شكر", "قلب عقل روح", "بحر نهر موج", "ورد زهر شجر",
            "أسد فهد نمر", "صقر نسر طير", "ماء هواء نار", "أرض سماء غيم", "ليل نهار فجر", "كتاب دفتر قلم", "مدرسة جامعة علم", "طبيب مهندس معلم", "وطن أمان سلام", "صدق وفاء إخلاص",
            "العلم نور", "الجهل ظلام", "الوقت كالسيف", "من جد وجد", "من زرع حصد", "العقل السليم", "في الجسم السليم", "الكلمة الطيبة", "خير الكلام", "احترام الكبير",
            "الصبر مفتاح الفرج", "النظافة من الإيمان", "الكلمة الطيبة صدقة", "احترام الكبير واجب", "العطف على الصغير", "بر الوالدين جنة", "القناعة كنز لا يفنى", "الصديق وقت الضيق", "في التأني السلامة", "وفي العجلة الندامة",
            "يد واحدة لا تصفق", "الجار قبل الدار", "الرفيق قبل الطريق", "الأفعال أبلغ من الأقوال", "عامل الناس كما تحب", "العلم يبني بيوتاً", "الجهل يهدم بيت العز", "من طلب العلا سهر", "خير جليس في الزمان", "وما نيل المطالب بالتمني"
        ];

        // 2. بيانات الشعر العربي المزدوج (10 أبيات = 10 صفحات)
        const arabicDouble = [
            ["دقات قلب المرء قائلة له", "إن الحياة دقائق وثواني"],
            ["وما نيل المطالب بالتمني", "ولكن تؤخذ الدنيا غلابا"],
            ["أنا لغة الأعراب من فطروا", "على الفصاحة من نبعي ومن طيني"],
            ["السيف أصدق أنباء من الكتب", "في حده الحد بين الجد واللعب"],
            ["الخيل والليل والبيداء تعرفني", "والسيف والرمح والقرطاس والقلم"],
            ["ألا ليت الشباب يعود يوماً", "فأخبره بما فعل المشيب"],
            ["لا تحسبن المجد تمراً أنت آكله", "لن تبلغ المجد حتى تلعق الصبرا"],
            ["إذا الشعب يوماً أراد الحياة", "فلا بد أن يستجيب القدر"],
            ["الأم مدرسة إذا أعددتها", "أعددت شعباً طيب الأعراق"],
            ["ومن هاب أسباب المنايا ينلنه", "وإن يرق أسباب السماء بسلم"]
        ];

        // 3. بيانات اللغة الكردية (20 درساً = 10 صفحات)
        const kurdishSingle = [
            "ئـ ب پ ت ج چ", "ح خ د ر ڕ ز ژ", 
            "س ش ع غ ف ڤ", "ق ک گ ل ڵ م", 
            "ن هـ ە و ۆ ی ێ", "دار، مار، کار، بار", 
            "دەست، چاو، گوێ، قاچ", "خۆزگە، هیوا، ژیان، ئاوات", 
            "هەولێر، سلێمانی، دهۆک", "هەڵەبجە، کەرکوک، زاخۆ",
            "کوردستان نیشتمانمە", "زمانی کوردی ناسنامەمە", 
            "پێشمەرگە پارێزەری خاکە", "کتێب باشترین هاوڕێیە", 
            "زانست ڕووناکی ژیانە", "قسەی هەق تاڵە", 
            "دڵۆپ دڵۆپ دەبێتە گۆم", "بەرد لە جێی خۆی سەنگینە", 
            "دار هەتا تەڕە دەچەمێتەوە", "کەس بە دۆی خۆی ناڵێت ترشە"
        ];

        const container = document.getElementById('pdf-container');
        let htmlContent = '';

        // بناء نموذج مفرد (سطر أستاذ + 4 شف + 2 فارغ)
        function generateSingleBlock(text) {
            let block = `<div class="line-row master">${text}</div>`;
            for(let i=0; i<4; i++) block += `<div class="line-row trace">${text}</div>`;
            for(let i=0; i<2; i++) block += `<div class="line-row empty"></div>`;
            return block;
        }

        // بناء نموذج مزدوج (سطرين أستاذ + 8 شف + 4 فارغ)
        function generateDoubleBlock(line1, line2) {
            let block = `<div class="line-row master">${line1}</div>`;
            block += `<div class="line-row master">${line2}</div>`;
            for(let i=0; i<4; i++) {
                block += `<div class="line-row trace">${line1}</div>`;
                block += `<div class="line-row trace">${line2}</div>`;
            }
            for(let i=0; i<2; i++) {
                block += `<div class="line-row empty"></div>`;
                block += `<div class="line-row empty"></div>`;
            }
            return block;
        }

        // 1. توليد أول 30 صفحة (عربي مفرد)
        for(let i=0; i < arabicSingle.length; i+=2) {
            htmlContent += `<div class="a4-paper">`;
            htmlContent += generateSingleBlock(arabicSingle[i]);
            htmlContent += generateSingleBlock(arabicSingle[i+1]);
            htmlContent += `</div>`;
        }

        // 2. توليد 10 صفحات (عربي شعر مزدوج)
        for(let i=0; i < arabicDouble.length; i++) {
            htmlContent += `<div class="a4-paper">`;
            htmlContent += generateDoubleBlock(arabicDouble[i][0], arabicDouble[i][1]);
            htmlContent += `</div>`;
        }

        // 3. توليد آخر 10 صفحات (كردي مفرد)
        for(let i=0; i < kurdishSingle.length; i+=2) {
            htmlContent += `<div class="a4-paper" dir="rtl" lang="ku">`;
            htmlContent += generateSingleBlock(kurdishSingle[i]);
            htmlContent += generateSingleBlock(kurdishSingle[i+1]);
            htmlContent += `</div>`;
        }

        // إدراج كل الصفحات داخل الموقع
        container.innerHTML = htmlContent;

    </script>
</body>
</html>
