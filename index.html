<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كراسة الخط - نظام الأرباع (50 صفحة)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

        /* إجبار المتصفح على طباعة الألوان الباهتة للشف */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #34495e;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-panel {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            width: 90%;
            max-width: 800px;
        }

        .btn-download {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(41, 128, 185, 0.4);
            margin-top: 10px;
        }
        .btn-download:hover { background-color: #1f6391; }

        .instructions { color: #e74c3c; font-weight: bold; margin-top: 15px; }

        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* -------------------------------------
           هندسة ورقة A4 ونظام التقسيم (Grid)
           ------------------------------------- */
        .a4-paper {
            width: 210mm;
            height: 297mm;
            background-color: white;
            box-sizing: border-box;
            padding: 15mm; /* هوامش خارجية */
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            page-break-after: always;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* تقسيم الصفحة لـ 4 أرباع (للكلمات العادية) */
        .grid-4-quarters {
            display: grid;
            grid-template-columns: 1fr 1fr; /* قسمين بالعرض (يمين ويسار) */
            grid-template-rows: 1fr 1fr;    /* قسمين بالطول (أعلى وأسفل) */
            column-gap: 15mm; /* المسافة بين اليمين واليسار */
            row-gap: 10mm;    /* المسافة بين الأعلى والأسفل */
            height: 100%;
        }

        /* تقسيم الصفحة لـ عمودين (للشعر الطويل) */
        .grid-2-columns {
            display: grid;
            grid-template-columns: 1fr 1fr; /* عمود يمين وعمود يسار */
            column-gap: 15mm;
            height: 100%;
        }

        /* المربع الواحد الذي يحوي الأسطر */
        .practice-block {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* إعدادات السطر الواحد */
        .line-row {
            height: 1.8cm; /* الارتفاع المثالي للكتابة */
            line-height: 1.7cm;
            border-bottom: 1.5px solid #bdc3c7; /* لون السطر */
            font-family: 'Aref Ruqaa', serif;
            font-size: 26px; /* تم التصغير قليلاً ليتسع في نصف الورقة */
            white-space: nowrap;
            overflow: hidden; /* لمنع تداخل الكلام يمين ويسار */
            padding-right: 5px;
            box-sizing: border-box;
        }

        /* الألوان */
        .master { color: #000; font-weight: bold; }
        .trace { color: #d1d8e0; }
        .empty { color: transparent; border-bottom: 1.5px dashed #bdc3c7; } /* سطر فارغ منقط للتمييز */

        /* الطباعة الأصلية */
        @page { size: A4 portrait; margin: 0; }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .header-panel { display: none !important; }
            #pdf-container { gap: 0; display: block; }
            .a4-paper { box-shadow: none; margin: 0; border: none; }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h1>كراسة نظام (الأرباع) - 50 صفحة</h1>
        <p>مقسمة يمين ويسار / أعلى وأسفل لضمان أقصى استفادة من الورق</p>
        <button class="btn-download" onclick="window.print()">📥 حفظ الكراسة بتنسيق PDF</button>
        <div class="instructions">⚠️ تأكد من اختيار "Save as PDF" عند ظهور نافذة الطباعة.</div>
    </div>

    <div id="pdf-container">
        <!-- توليد الصفحات برمجياً -->
    </div>

    <script>
        // --- 1. البيانات الأساسية ---
        // (60 درساً عربياً)
        const baseArabicSingle = [
            "ا ل ك ط ظ", "ب ت ث ف", "ج ح خ", "د ذ ر ز", "س ش ص ض", "ع غ ق ف", "م ن هـ و ي", "لا ـلا", "أب أخ أم", "جد عم خال",
            "باب بيت نور", "قمر شمس نجم", "سيف رمح قوس", "علم عمل أمل", "صدق صبر شكر", "قلب عقل روح", "بحر نهر موج", "ورد زهر شجر", "أسد فهد نمر", "صقر نسر طير",
            "ماء هواء نار", "أرض سماء غيم", "ليل نهار فجر", "كتاب دفتر قلم", "مدرسة جامعة", "طبيب مهندس", "وطن أمان سلام", "صدق وفاء", "العلم نور", "الجهل ظلام",
            "الوقت كالسيف", "من جد وجد", "من زرع حصد", "العقل السليم", "الجسم السليم", "الكلمة الطيبة", "خير الكلام", "احترام الكبير", "الصبر مفتاح", "النظافة إيمان",
            "الكلمة صدقة", "احترام واجب", "العطف عالصغير", "بر الوالدين", "القناعة كنز", "الصديق وقت الضيق", "في التأني السلامة", "العجلة الندامة", "يد لا تصفق", "الجار قبل الدار",
            "الرفيق قبل الطريق", "الأفعال أبلغ", "عامل كما تحب", "العلم يبني", "الجهل يهدم", "من طلب العلا", "خير جليس كتاب", "وما نيل المطالب", "تؤخذ غلابا", "نهاية الدروس"
        ];

        // (10 أبيات شعرية)
        const baseArabicDouble = [
            ["دقات قلب المرء قائلة", "إن الحياة دقائق وثواني"], ["وما نيل المطالب بالتمني", "ولكن تؤخذ الدنيا غلابا"],
            ["أنا لغة الأعراب من فطروا", "على الفصاحة من نبعي"], ["السيف أصدق أنباء من الكتب", "في حده الحد بين الجد"],
            ["الخيل والليل والبيداء", "والسيف والرمح والقرطاس"], ["ألا ليت الشباب يعود يوماً", "فأخبره بما فعل المشيب"],
            ["لا تحسبن المجد تمراً آكله", "لن تبلغ المجد حتى تلعق"], ["إذا الشعب يوماً أراد الحياة", "فلا بد أن يستجيب القدر"],
            ["الأم مدرسة إذا أعددتها", "أعددت شعباً طيب الأعراق"], ["ومن هاب أسباب المنايا", "وإن يرق أسباب السماء"]
        ];

        // (20 درساً كردياً)
        const baseKurdishSingle = [
            "ئـ ب پ ت ج چ", "ح خ د ر ڕ ز ژ", "س ش ع غ ف ڤ", "ق ک گ ل ڵ م", "ن هـ ە و ۆ ی ێ", 
            "دار، مار، کار، بار", "دەست، چاو، گوێ", "خۆزگە، هیوا، ژیان", "هەولێر، سلێمانی", "دهۆک، هەڵەبجە",
            "کوردستان نیشتمانمە", "زمانی کوردی", "پێشمەرگە پارێزەرە", "کتێب باشترین هاوڕێیە", "زانست ڕووناکیە", 
            "قسەی هەق تاڵە", "دڵۆپ دڵۆپ گۆمە", "بەرد سەنگینە", "دار دەچەمێتەوە", "کەس ناڵێت ترشە"
        ];

        // --- 2. مضاعفة البيانات لتغطية 50 صفحة بالكامل ---
        // بما أن الورقة العادية تأخذ 4 دروس، لعمل 30 صفحة نحتاج (30 * 4 = 120 درساً). نضاعف المصفوفة مرتين.
        const arabicSingle120 = [...baseArabicSingle, ...baseArabicSingle]; 
        
        // ورقة الشعر تأخذ درسين (عمود يمين وعمود يسار). لعمل 10 صفحات نحتاج (10 * 2 = 20 درساً).
        const arabicDouble20 = [...baseArabicDouble, ...baseArabicDouble];
        
        // ورقة الكردي تأخذ 4 دروس. لعمل 10 صفحات نحتاج (10 * 4 = 40 درساً).
        const kurdishSingle40 = [...baseKurdishSingle, ...baseKurdishSingle];

        const container = document.getElementById('pdf-container');
        let htmlContent = '';

        // --- 3. دوال بناء المربعات (Blocks) ---
        // بناء ربع صفحة (7 أسطر: 1 أستاذ، 4 شف، 2 فارغ)
        function generateQuarterBlock(text) {
            let block = `<div class="practice-block">`;
            block += `<div class="line-row master">${text}</div>`;
            for(let i=0; i<4; i++) block += `<div class="line-row trace">${text}</div>`;
            for(let i=0; i<2; i++) block += `<div class="line-row empty"></div>`;
            block += `</div>`;
            return block;
        }

        // بناء عمود كامل للشعر (14 سطراً: 2 أستاذ، 8 شف، 4 فارغ)
        function generateFullColumnBlock(line1, line2) {
            let block = `<div class="practice-block">`;
            block += `<div class="line-row master">${line1}</div>`;
            block += `<div class="line-row master">${line2}</div>`;
            for(let i=0; i<4; i++) {
                block += `<div class="line-row trace">${line1}</div>`;
                block += `<div class="line-row trace">${line2}</div>`;
            }
            for(let i=0; i<2; i++) {
                block += `<div class="line-row empty"></div>`;
                block += `<div class="line-row empty"></div>`;
            }
            block += `</div>`;
            return block;
        }

        // --- 4. عملية التجميع للصفحات ---

        // أ) 30 صفحة عربي (نظام الأرباع 4 مربعات في الصفحة)
        for(let i=0; i < arabicSingle120.length; i+=4) {
            htmlContent += `
            <div class="a4-paper">
                <div class="grid-4-quarters">
                    ${generateQuarterBlock(arabicSingle120[i])}     <!-- أعلى اليمين -->
                    ${generateQuarterBlock(arabicSingle120[i+1])}   <!-- أعلى اليسار -->
                    ${generateQuarterBlock(arabicSingle120[i+2])}   <!-- أسفل اليمين -->
                    ${generateQuarterBlock(arabicSingle120[i+3])}   <!-- أسفل اليسار -->
                </div>
            </div>`;
        }

        // ب) 10 صفحات شعر عربي (نظام العمودين)
        for(let i=0; i < arabicDouble20.length; i+=2) {
            htmlContent += `
            <div class="a4-paper">
                <div class="grid-2-columns">
                    ${generateFullColumnBlock(arabicDouble20[i][0], arabicDouble20[i][1])}     <!-- العمود الأيمن -->
                    ${generateFullColumnBlock(arabicDouble20[i+1][0], arabicDouble20[i+1][1])} <!-- العمود الأيسر -->
                </div>
            </div>`;
        }

        // ج) 10 صفحات كردي (نظام الأرباع 4 مربعات في الصفحة)
        for(let i=0; i < kurdishSingle40.length; i+=4) {
            htmlContent += `
            <div class="a4-paper" lang="ku">
                <div class="grid-4-quarters">
                    ${generateQuarterBlock(kurdishSingle40[i])}     <!-- أعلى اليمين -->
                    ${generateQuarterBlock(kurdishSingle40[i+1])}   <!-- أعلى اليسار -->
                    ${generateQuarterBlock(kurdishSingle40[i+2])}   <!-- أسفل اليمين -->
                    ${generateQuarterBlock(kurdishSingle40[i+3])}   <!-- أسفل اليسار -->
                </div>
            </div>`;
        }

        // وضع كل الصفحات في الموقع
        container.innerHTML = htmlContent;

    </script>
</body>
</html>
